<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Majburiy Obuna</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --card-top:#1d2b62; --card-bot:#141c47;
    --red-1:#ef4a5a; --red-2:#c4202f;
    --gold:#f5c04a;
    --muted:#aeb7d6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(180deg,#0f1a45 0%,#2a3b78 35%,#dfe6f3 70%,#f4f7fc 100%);
    overflow:hidden;
  }

  /* qor */
  .snow{position:fixed;inset:0;pointer-events:none;z-index:1}
  .snow i{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.8;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(105vh)}}

  /* qulf oynasi */
  #gate{position:fixed;inset:0;z-index:10;display:flex;justify-content:center;align-items:flex-start;padding:70px 14px 0}
  #gate.hidden{display:none}
  .card{
    position:relative;width:100%;max-width:440px;
    padding:58px 18px 20px;
    background:linear-gradient(180deg,var(--card-top),var(--card-bot));
    border:1px solid rgba(255,255,255,.18);
    border-radius:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
    text-align:center;
  }
  .lock{
    position:absolute;top:-34px;left:50%;transform:translateX(-50%);
    width:80px;height:80px;border-radius:24px;
    background:linear-gradient(180deg,var(--red-1),var(--red-2));
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 22px rgba(196,32,47,.55);
  }
  .lock svg{width:38px;height:38px}
  h1{color:#fff;font-size:28px;font-weight:800;margin-bottom:10px}
  .sub{color:var(--muted);font-size:17px;line-height:1.35;margin:0 8px 20px}

  .row{
    display:flex;align-items:center;gap:12px;
    padding:12px 12px;margin-bottom:12px;
    border:1.5px solid rgba(255,255,255,.28);
    border-radius:20px;
    background:rgba(255,255,255,.03);
    transition:border-color .2s, background .2s;
  }
  .row.missing{border-color:var(--red-1);background:rgba(239,74,90,.12);animation:shake .35s}
  .row.ok{border-color:#3ecf7a}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .ico{
    flex:0 0 auto;width:54px;height:54px;border-radius:50%;
    background:linear-gradient(180deg,var(--red-1),var(--red-2));
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
  }
  .ico svg{width:26px;height:26px}
  .name{flex:1;min-width:0;text-align:left;color:#fff;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .go{
    flex:0 0 auto;border:0;cursor:pointer;color:#fff;font-weight:700;font-size:15px;
    padding:12px 14px;border-radius:12px;
    background:linear-gradient(180deg,var(--red-1),var(--red-2));
    box-shadow:0 3px 10px rgba(196,32,47,.45);
  }
  .go:active,.check:active{transform:scale(.97)}
  .check{
    width:100%;margin-top:6px;border:0;cursor:pointer;color:#fff;font-weight:800;font-size:22px;
    padding:20px;border-radius:22px;
    background:linear-gradient(180deg,var(--red-1),var(--red-2));
    box-shadow:0 6px 18px rgba(196,32,47,.5);
  }
  .check[disabled]{opacity:.7}
  .msg{min-height:20px;margin-top:12px;color:#ffb3bb;font-size:15px;font-weight:600}

  /* ilova */
  #app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;padding:18px 16px 24px;overflow:auto}
  .top{width:100%;max-width:440px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:linear-gradient(180deg,var(--card-top),var(--card-bot));border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:10px 12px;color:#fff}
  .stat small{display:block;color:var(--muted);font-size:12px}
  .stat b{font-size:20px}
  .coinwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;min-height:340px}
  #bal{font-size:44px;font-weight:800;color:#1b2552}
  #bal span{font-size:20px;color:#c4202f}
  #coin{width:230px;height:230px;border-radius:50%;border:0;cursor:pointer;position:relative;
    background:radial-gradient(circle at 35% 30%,#fff4b8,#f5c04a 45%,#c98a12 100%);
    box-shadow:0 0 0 8px rgba(245,192,74,.35),0 18px 40px rgba(0,0,0,.35);
    font-size:46px;font-weight:900;color:#7a4d00;transition:transform .08s;user-select:none;touch-action:manipulation}
  #coin:active{transform:scale(.94)}
  #coin[disabled]{filter:grayscale(.8);opacity:.7}
  .fly{position:fixed;z-index:50;color:#c4202f;font-weight:800;font-size:22px;pointer-events:none;animation:up .8s ease-out forwards}
  @keyframes up{to{transform:translateY(-90px);opacity:0}}
  .bar{width:100%;max-width:440px;height:10px;border-radius:6px;background:rgba(27,37,82,.2);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red-1),var(--gold))}
  .actions{width:100%;max-width:440px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .act{border:0;cursor:pointer;color:#fff;font-weight:800;font-size:16px;padding:16px;border-radius:18px;background:linear-gradient(180deg,var(--red-1),var(--red-2));box-shadow:0 5px 14px rgba(196,32,47,.4)}
  .note{max-width:440px;color:#1b2552;font-size:13px;text-align:center;margin-top:10px;min-height:18px}
</style>
</head>
<body>

<div class="snow" id="snow"></div>

<!-- Asosiy ilova shu yerda (tap, do'kon va h.k.) -->
<div id="app">
  <div class="top">
    <div class="stat"><small>Do'stlar</small><b id="fr">0</b> / <span id="frMin">10</span></div>
    <div class="stat"><small>Bugun</small><b id="td">0</b> / <span id="lim">20</span> UC</div>
  </div>
  <div class="coinwrap">
    <div id="bal">0.0 <span>UC</span></div>
    <button id="coin">UC</button>
    <div class="bar"><i id="barFill"></i></div>
  </div>
  <div class="actions">
    <button class="act" id="invite">👥 Do'st taklif qilish</button>
    <button class="act" id="withdraw">💸 Yechib olish</button>
  </div>
  <div class="note" id="note"></div>
</div>

<!-- Majburiy obuna oynasi -->
<div id="gate" class="hidden">
  <div class="card">
    <div class="lock">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="11" width="14" height="9" rx="2" fill="#fff" stroke="none"/>
        <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
        <circle cx="12" cy="15.5" r="1.4" fill="#c4202f" stroke="none"/>
      </svg>
    </div>
    <h1>Majburiy Obuna</h1>
    <p class="sub">Davom etish uchun quyidagi kanallarga obuna bo'ling.</p>
    <div id="list"></div>
    <button class="check" id="checkBtn">Tekshirish</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
let REQUIRED = [];
const CHECK_URL = "/api/check-sub";

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const gate = document.getElementById("gate");
const list = document.getElementById("list");
const msg  = document.getElementById("msg");
const btn  = document.getElementById("checkBtn");

const megaphone = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z" fill="#fff"/><path d="M15 9a4 4 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>';

function render(){
  list.innerHTML = "";
  REQUIRED.forEach(c=>{
    const row = document.createElement("div");
    row.className = "row"; row.dataset.u = c.username;
    row.innerHTML = '<div class="ico">'+megaphone+'</div><div class="name">'+c.title+'</div><button class="go">Kanalga o\'tish</button>';
    row.querySelector(".go").onclick = ()=>{
      const url = "https://t.me/"+c.username;
      tg && tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url,"_blank");
    };
    list.appendChild(row);
  });
}

async function check(){
  btn.disabled = true; msg.textContent = "";
  try{
    const r = await fetch(CHECK_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ initData: tg ? tg.initData : "" })
    });
    const data = await r.json();            // { ok: true } yoki { ok:false, missing:["username",...] }
    if(data.ok){ gate.classList.add("hidden"); window.onSubOk && window.onSubOk(); return true; }
    gate.classList.remove("hidden");
    document.querySelectorAll(".row").forEach(row=>{
      const bad = (data.missing||[]).includes(row.dataset.u);
      row.classList.toggle("missing", bad);
      row.classList.toggle("ok", !bad);
    });
    msg.textContent = "Kanalga a'zo bo'ling!";
    tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("error");
  }catch(e){
    gate.classList.remove("hidden");
    msg.textContent = "Xatolik. Qayta urinib ko'ring.";
  }finally{ btn.disabled = false; }
  return false;
}

btn.onclick = check;
fetch("/api/config").then(r=>r.json()).then(c=>{ window.BOT_NAME=c.botName; REQUIRED=c.chats; render(); check(); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) check(); }); // kanaldan qaytganda

// Har bir tap/yechish/xarid oldidan chaqiring: if(!(await check())) return;
window.requireSub = check;


/* ===== Tap ilovasi ===== */
const $ = id => document.getElementById(id);
let S = null, pending = 0, started = false, flushing = false;

async function api(path, extra){
  const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(Object.assign({initData: tg ? tg.initData : ""}, extra||{}))});
  if(r.status === 403){ check(); throw new Error("sub"); }
  return r.json();
}
function paint(){
  if(!S) return;
  const earned = S.today + pending*S.tap;
  $("bal").innerHTML = (S.balance + pending*S.tap).toFixed(1) + " <span>UC</span>";
  $("fr").textContent = S.friends; $("frMin").textContent = S.minFriends;
  $("td").textContent = earned.toFixed(1); $("lim").textContent = S.dailyLimit;
  $("barFill").style.width = Math.min(100, earned / S.dailyLimit * 100) + "%";
  $("coin").disabled = earned >= S.dailyLimit - 1e-9;
}
function note(t){ $("note").textContent = t; }

window.onSubOk = async function(){
  if(started) return; started = true;
  const d = await api("/api/me"); if(d.ok){ S = d; paint(); }
};

$("coin").addEventListener("pointerdown", e=>{
  if(!S || $("coin").disabled) return;
  pending++; paint();
  const f = document.createElement("div"); f.className = "fly"; f.textContent = "+" + S.tap;
  f.style.left = e.clientX - 12 + "px"; f.style.top = e.clientY - 30 + "px";
  document.body.appendChild(f); setTimeout(()=>f.remove(), 800);
  tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light");
});

async function flush(){
  if(flushing || !pending || !S) return;
  flushing = true;
  const n = pending; pending = 0;
  try{ const d = await api("/api/tap",{taps:n}); if(d.ok) S = d; }
  catch(e){ pending += n; }
  flushing = false; paint();
}
setInterval(flush, 1000);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) flush(); });

$("invite").onclick = ()=>{
  if(!S) return;
  const link = "https://t.me/" + (window.BOT_NAME || "") + "?start=ref_" + S.id;
  const text = "🪙 UC Tap — tap qiling va bepul UC yig'ing!";
  const url = "https://t.me/share/url?url=" + encodeURIComponent(link) + "&text=" + encodeURIComponent(text);
  tg && tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url,"_blank");
};

$("withdraw").onclick = async ()=>{
  if(!S) return; await flush();
  if(S.balance < S.minWithdraw) return note("Kamida " + S.minWithdraw + " UC kerak.");
  if(S.friends < S.minFriends) return note("Kamida " + S.minFriends + " ta do'st taklif qiling.");
  const id = prompt("PUBG ID kiriting:");
  if(!id) return;
  const d = await api("/api/withdraw",{pubgId:id});
  if(d.ok){ S = d; paint(); note("✅ So'rov yuborildi. Admin tasdiqlaydi."); }
  else note(d.error || "Xatolik");
};

/* qor animatsiyasi */
(function(){
  const s = document.getElementById("snow");
  for(let i=0;i<45;i++){
    const d = document.createElement("i");
    const size = 3+Math.random()*5;
    d.style.cssText = "left:"+Math.random()*100+"%;width:"+size+"px;height:"+size+"px;animation-duration:"+(6+Math.random()*9)+"s;animation-delay:-"+Math.random()*12+"s;opacity:"+(.4+Math.random()*.6);
    s.appendChild(d);
  }
})();
</script>
</body>
</html>
